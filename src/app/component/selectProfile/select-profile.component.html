<div class="select-page">
  <div class="header">
    <div class="back-emoji">🎶</div>
    <h1>Who are you?</h1>
    <p class="subtitle">Choose your festival identity</p>
  </div>

  <div *ngIf="isLoading" class="loading-wrap">
    <div class="loader"></div>
    <p>Loading profiles…</p>
  </div>

  <div *ngIf="isClaiming" class="loading-wrap">
    <div class="loader"></div>
    <p>Claiming your identity…</p>
  </div>

  <div *ngIf="!isLoading && !isClaiming && profiles.length === 0" class="empty">
    <p>😢 All profiles have been claimed!</p>
  </div>

  <div class="profile-grid" *ngIf="!isLoading && !isClaiming">
    @for (profile of profiles; track profile.id) {
      <div class="profile-card" (click)="selectProfile(profile)">
        <div class="avatar-wrap">
          <img [src]="profile.url || 'https://api.dicebear.com/8.x/thumbs/svg?seed=' + profile.name"
               [alt]="profile.name" />
        </div>
        <p class="name">{{ profile.name }}</p>
        <span class="claim-label">Tap to claim ✦</span>
      </div>
    }
  </div>
</div>
