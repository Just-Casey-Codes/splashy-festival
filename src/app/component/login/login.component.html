<div class="login-page">
  <div class="stars"></div>

  <div class="login-card">
    <div class="logo">🎶</div>
    <h1 class="title">Splashy Fen</h1>
    <p class="subtitle">Festival 2026</p>
    <p class="tagline">Your ultimate festival companion</p>

    <button
      class="google-btn"
      (click)="login()"
      [disabled]="isLoading"
    >
      <span *ngIf="!isLoading">
        <svg width="20" height="20" viewBox="0 0 48 48" style="vertical-align:middle;margin-right:10px">
          <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3L37.5 10.5C34.2 7.5 29.4 6 24 6 12.9 6 4 14.9 4 26s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
          <path fill="#FF3D00" d="M6.3 15.1l6.6 4.8C14.5 16.1 18.9 14 24 14c3.1 0 5.8 1.1 7.9 3L37.5 10.5C34.2 7.5 29.4 6 24 6c-7.7 0-14.3 3.7-18.7 9.1z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.4-5l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.1 0-9.5-3.2-11.2-7.8l-6.6 5C9.9 40.2 16.4 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.1-3.9 5.5l6.2 5.2C41.2 35.5 44 31 44 26c0-1.3-.1-2.6-.4-3.9z"/>
        </svg>
        Sign in with Google
      </span>
      <span *ngIf="isLoading" class="spinner"></span>
    </button>
  </div>
</div>
